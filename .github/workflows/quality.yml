name: Brightdesk Design System quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "design/**", "feature/**"]
    paths:
      - "css/**"
      - "components/**"
      - "tests/**"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-system-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Verify shared visual foundations
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - name: Check out Brightdesk Design System
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned checkout action
      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned setup-node action
        with:
          node-version: 24.22.2
      - name: Verify the required Node.js runtime
        run: |
          test "$(node --version)" = "v24.22.2"
      - name: Check product-window regression tests
        run: node --check tests/product-window-shell.test.mjs
      - name: Run product-window regression tests
        run: node --test tests/product-window-shell.test.mjs
