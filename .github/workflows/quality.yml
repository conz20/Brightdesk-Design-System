name: Brightdesk Design System quality

on:
  pull_request:
  push:
    branches: [main, "design/**", "feature/**"]
    paths:
      - "css/**"
      - "components/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

concurrency:
  group: design-system-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Verify shared visual and typography foundations
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out Brightdesk Design System
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned checkout action
      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned setup-node action
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Verify the required Node.js runtime
        run: test "$(node --version)" = "v24.22.2"
      - name: Run the design-system test suite
        run: |
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund
            npm run verify
          else
            node --check tests/product-window-shell.test.mjs
            node --test tests/*.test.mjs
          fi
